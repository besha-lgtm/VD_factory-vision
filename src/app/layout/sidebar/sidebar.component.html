<div 
  class="sidebar-backdrop" 
  [class.visible]="!isCollapsed && isMobile"
  (click)="closeSidebar()">
</div>

<div class="sidebar" [class.collapsed]="isCollapsed">

  <!-- LOGO -->
 <div class="logo">
  <div class="logo-image">
    <img src="assets/images/logo.png" alt="VISIPAK ERP Logo">
  </div>

  <div class="logo-text" *ngIf="!isCollapsed">
    <h4>VISIPAK ERP</h4>
    <span>AI Vision </span>
  </div>
</div>
  <!-- SCROLLABLE MENU -->
  <div class="menu-container">
    <div class="menu">

      <!-- OVERVIEW -->
      <p class="menu-title">OVERVIEW</p>
      <div class="menu-group">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="onNavClick()">
          <i class="pi pi-chart-bar"></i>
          <span class="menu-text">Dashboard</span>
        </a>
      </div>
      
      <div class="menu-group">
        <a routerLink="/factory-monitoring" routerLinkActive="active" (click)="onNavClick()">
          <i class="pi pi-video"></i>
          <span class="menu-text">Factory Monitoring</span>
        </a>
      </div>

</div>
